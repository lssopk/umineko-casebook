services:
  casebook:
    build: .
    container_name: umineko-casebook
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${PORT:-5699}:5699"
    environment:
      PORT: "5699"
      HOST: "0.0.0.0"
      STATE_DIR: /app/state
      PUBLIC_HTTPS: "${PUBLIC_HTTPS:-0}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_BASE_URL: "${AI_BASE_URL:-https://api.openai.com/v1}"
      AI_MODEL: "${AI_MODEL:-gpt-4.1-mini}"
      AI_DAILY_LIMIT: "${AI_DAILY_LIMIT:-25}"
      AI_AUTO_EDIT: "${AI_AUTO_EDIT:-0}"
    volumes:
      - casebook-state:/app/state
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5699/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  casebook-state:
